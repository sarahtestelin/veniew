name: Mise à jour des concerts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chercher les concerts
        run: node scripts/refresh.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Enregistrer data.json
        run: |
          git config user.name "concerts-bot"
          git config user.email "concerts-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Pas de changement."
          else
            git commit -m "Mise à jour des concerts"
            git pull --rebase
            git push
          fi
